[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "semantic-video-search"
version = "1.0.0"
description = "Multimodal semantic video search with LanceDB, Gemini AI, and ffmpeg"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [
    { name = "lord-dubious" }
]
keywords = [
    "ai",
    "video-search",
    "semantic-search",
    "lancedb",
    "gemini",
    "multimodal",
    "rag"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "google-generativeai>=0.8.0",
    "lancedb>=0.15.0",
    "pyarrow>=18.0.0",
    "pydantic>=2.0.0",
    "python-dotenv>=1.0.0",
    "rich>=13.0.0",
    "typer>=0.12.0",
    "httpx>=0.27.0",
    "numpy>=1.24.0",
    "pillow>=10.0.0",
    "ffmpeg-python>=0.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.8.0",
    "pre-commit>=4.0.0",
]

[project.scripts]
video-search = "video_search.cli:app"

[project.urls]
Homepage = "https://github.com/lord-dubious/semantic-video-search"
Repository = "https://github.com/lord-dubious/semantic-video-search"

[tool.hatch.build.targets.wheel]
packages = ["src/video_search"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "C4", "SIM"]
ignore = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
